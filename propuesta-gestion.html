:root{
  --ink:#0B2B40; --ink2:#184761; --canal:#0A6FA8; --agua:#00B4F0; --hielo:#E4F5FD;
  --papel:#EFF4F7; --sup:#FFFFFF; --linea:#D2DDE4; --linea2:#AEBFCA;
  --txt:#16303F; --txt2:#4D6577; --txt3:#7C8F9C;
  --ok:#157347; --okb:#E1F2E8; --av:#9A6500; --avb:#FFF2CC; --mal:#B4322A; --malb:#FBE6E3; --neu:#E7EDF1;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --sans:'Barlow','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--txt);background:var(--papel);-webkit-font-smoothing:antialiased}
a{color:var(--canal);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--agua);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* estructura */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin}
.brand{padding:22px 22px 16px}
.brand b{display:block;font-family:var(--cond);font-weight:700;font-size:28px;letter-spacing:.06em;line-height:1}
.brand span{display:block;font-size:13px;color:#A9C2D2;margin-top:6px;line-height:1.35}
.areas{display:grid;grid-template-columns:1fr 1fr;margin:0 14px 10px;border:1px solid rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.areas button{border:0;background:none;color:#C9DAE5;padding:9px 6px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2}
.areas button.on{background:var(--agua);color:var(--ink)}
.nav{padding:4px 0 10px;flex:1}
.nav h3{font-size:12px;font-weight:500;color:#8FB0C4;padding:14px 22px 5px}
.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#DCE8EF;padding:7px 22px 7px 19px;font-size:14.5px;cursor:pointer;border-left:3px solid transparent;line-height:1.3}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(0,180,240,.14);border-left-color:var(--agua);color:#fff;font-weight:600}
.nav button small{float:right;font-size:11.5px;color:#8FB0C4;font-weight:500;margin-top:2px}
.sidefoot{padding:14px 22px 18px;font-size:12px;color:#8FB0C4;line-height:1.5;border-top:1px solid rgba(255,255,255,.1)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:40;background:var(--sup);border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:18px;padding:10px 32px;flex-wrap:wrap}
.wk{display:flex;align-items:baseline;gap:12px}
.wk b{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1;color:var(--ink)}
.wk span{font-size:13.5px;color:var(--txt2)}
.top .sp{flex:1}
.sw{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--txt2);cursor:pointer;user-select:none}
.sw i{width:34px;height:18px;border-radius:9px;background:var(--linea2);position:relative;transition:background .15s;flex-shrink:0}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on i{background:#D99A00}.sw.on i::after{left:18px}
.supbar{background:var(--avb);border-bottom:1px solid #E9D48A;color:#5E4300;font-size:13.5px;padding:7px 32px}
.page{padding:28px 32px 56px;max-width:1320px}
.view{display:none}.view.on{display:block}
.ph{margin-bottom:22px;max-width:860px}
.ph h1{font-family:var(--cond);font-weight:600;font-size:38px;line-height:1.08;color:var(--ink);letter-spacing:.005em}
.ph p{margin-top:9px;font-size:16px;color:var(--txt2);line-height:1.5}
.ruta{font-size:13px;color:var(--txt3);margin-bottom:6px}

/* paneles */
.panel{background:var(--sup);border:1px solid var(--linea);border-radius:3px;margin-bottom:18px}
.panel.pri{border-top:3px solid var(--ink)}
.panel>header{padding:14px 20px 12px;border-bottom:1px solid var(--linea);display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.panel>header h2{font-size:17px;font-weight:600;color:var(--ink);line-height:1.25}
.panel>header p{font-size:13.5px;color:var(--txt2);margin-top:2px;max-width:70ch}
.panel>.body{padding:16px 20px}
.panel>.body.flush{padding:0}
.cols{display:grid;gap:18px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c21{grid-template-columns:1.65fr 1fr}.c12{grid-template-columns:1fr 1.65fr}
.cols>.panel{margin-bottom:0}.cols{margin-bottom:18px}
.stack{display:flex;flex-direction:column;gap:18px}.stack>.panel{margin-bottom:0}

/* tira de cifras */
.tira{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sup);border:1px solid var(--linea);border-radius:3px;margin-bottom:18px}
.tira>div{padding:16px 20px;border-right:1px solid var(--linea)}
.tira>div:last-child{border-right:0}
.tira b{display:block;font-family:var(--cond);font-weight:600;font-size:40px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.tira b.ok{color:var(--ok)}.tira b.av{color:var(--av)}.tira b.mal{color:var(--mal)}

/* tabla */
.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--txt2);padding:9px 12px;border-bottom:2px solid var(--ink);white-space:nowrap;background:var(--sup)}

.t .sub{font-size:13px;color:var(--txt2);margin-top:2px}

.tw{overflow-x:auto}
.det>td{background:#F7FAFC;padding:0 12px 16px}
.detg{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;border-top:1px solid var(--linea);padding-top:14px}

/* etiquetas */

.b.ok{background:var(--okb);color:var(--ok)}.b.av{background:var(--avb);color:var(--av)}.b.mal{background:var(--malb);color:var(--mal)}.b.inf{background:var(--hielo);color:var(--canal)}.b.ink{background:var(--ink);color:#fff}
.b.sup{background:none;border:1px dashed #C99700;color:#8A5E00;padding:1px 6px}
.b.pend{background:none;border:1px dotted var(--linea2);color:var(--txt3);padding:1px 6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--linea2)}
.dot.ok{background:var(--ok)}.dot.av{background:#E0A100}.dot.mal{background:var(--mal)}
.supv{border-bottom:1.5px dashed #C99700;color:#7A5200}

/* controles */
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:8px 14px;border-radius:3px;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--ink2)}
.btn.sec{background:var(--sup);color:var(--ink)}.btn.sec:hover{background:var(--hielo)}

.btn.lnk{border:0;background:none;color:var(--canal);padding:0;text-decoration:underline;text-underline-offset:2px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--linea2);background:var(--sup);color:var(--txt);font-size:13px;padding:5px 10px;border-radius:2px;cursor:pointer}
.chip:hover{border-color:var(--ink)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.f label,.fl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--txt2);font-weight:500}
.f .w2{grid-column:span 2}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--linea2);border-radius:3px;background:var(--sup);padding:7px 9px;font-size:14px;color:var(--txt);width:100%}

.nota{font-size:13px;color:var(--txt3);line-height:1.5;margin-top:10px;max-width:95ch}

/* filas de lista */

/* intro y leyenda */

/* regla de semanas */

.rg-hoy{position:absolute;top:-10px;bottom:-10px;width:2px;background:var(--agua);z-index:2}

/* matriz datos x destinatario */
.mx{border-collapse:collapse;font-size:14px;width:100%}
.mx th{font-size:12.5px;font-weight:600;color:var(--txt2);padding:8px 6px;border-bottom:2px solid var(--ink);text-align:center;vertical-align:bottom;line-height:1.2}

/* matriz de prioridad */

/* varios */

details.mas{background:var(--sup);border:1px solid var(--linea);border-radius:3px;margin-bottom:12px}

.uso{margin-bottom:14px}.uso:last-child{margin-bottom:0}

.uso .l b{font-weight:600;color:var(--ink)}.uso .l span{font-family:var(--cond);font-weight:600;font-size:22px;color:var(--ink)}

.act{padding:12px 0;border-bottom:1px solid var(--linea);font-size:14px;line-height:1.5}

.net{position:relative}.net svg{width:100%;height:auto;display:block}

.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--txt2);margin-top:8px}

@media (max-width:1100px){.c2,.c3,.c21,.c12,.intro,.exp3,.cruce,.detg,.ref,.g2{grid-template-columns:1fr}.exp3>div,.cruce>div{border-right:0;border-bottom:1px solid var(--linea)}.tira{grid-auto-flow:row}.tira>div{border-right:0;border-bottom:1px solid var(--linea)}.ob8{grid-template-columns:1fr 1fr}.paso{grid-template-columns:1fr 1fr}.rg-head,.rg-row{grid-template-columns:1fr}.rg-est{text-align:left}.bar{grid-template-columns:24px 1fr 70px 80px}.bar .tr,.bar .x1{display:none}.flujo{grid-template-columns:1fr}.pm{font-size:12px}}

<script>
// Motor del revisor de reportes. Sin dependencias: corre en navegador y en Node.
(function (root) {
  'use strict';

  // Lee CSV con separador coma, punto y coma o tabulación, con comillas.
  function parseCSV(text) {
    text = String(text).replace(/^﻿/, '').replace(/\r\n?/g, '\n');
    var first = text.split('\n')[0] || '';
    var counts = { ';': 0, ',': 0, '\t': 0 };
    var inQ = false;
    for (var i = 0; i < first.length; i++) {
      var ch = first[i];
      if (ch === '"') inQ = !inQ;
      else if (!inQ && counts.hasOwnProperty(ch)) counts[ch]++;
    }
    var sep = ';';
    if (counts[','] > counts[sep]) sep = ',';
    if (counts['\t'] > counts[sep]) sep = '\t';

    var rows = [], row = [], cell = '';
    inQ = false;
    for (var j = 0; j < text.length; j++) {
      var c = text[j];
      if (inQ) {
        if (c === '"') {
          if (text[j + 1] === '"') { cell += '"'; j++; } else inQ = false;
        } else cell += c;
      } else if (c === '"') inQ = true;
      else if (c === sep) { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    rows = rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ''; }); });
    if (!rows.length) return { headers: [], rows: [], sep: sep };
    var headers = rows[0].map(function (h, k) { return String(h).trim() || 'Columna ' + (k + 1); });
    var body = rows.slice(1).map(function (r) {
      var out = [];
      for (var k = 0; k < headers.length; k++) out.push(r[k] === undefined ? '' : String(r[k]).trim());
      return out;
    });
    return { headers: headers, rows: body, sep: sep };
  }

  // Convierte texto a número aceptando formato chileno (1.234,5) y anglosajón (1,234.5).
  function toNumber(s) {
    if (s === null || s === undefined) return NaN;
    var t = String(s).trim().replace(/\s/g, '').replace(/%$/, '');
    if (t === '') return NaN;
    if (!/^[-+]?[\d.,]+$/.test(t)) return NaN;
    var lastComma = t.lastIndexOf(','), lastDot = t.lastIndexOf('.');
    if (lastComma > -1 && lastDot > -1) {
      // Ambos presentes: el que va al final es el decimal.
      if (lastComma > lastDot) t = t.replace(/\./g, '').replace(',', '.');
      else t = t.replace(/,/g, '');
    } else if (lastComma > -1) {
      // Solo coma: decimal (uso chileno). Varias comas: separador de miles.
      if (t.split(',').length === 2) t = t.replace(',', '.');
      else t = t.replace(/,/g, '');
    } else if (lastDot > -1) {
      // Solo punto: miles si forma grupos exactos de tres (1.234 o 1.234.567); si no, decimal.
      if (/^[-+]?[1-9]\d{0,2}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    }
    var n = Number(t);
    return isFinite(n) ? n : NaN;
  }

  function toDate(s) {
    var t = String(s || '').trim();
    var m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (m) return new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
    m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return null;
  }

  function median(a) {
    var s = a.slice().sort(function (x, y) { return x - y; });
    var n = s.length;
    if (!n) return NaN;
    return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
  }

  // Clasifica cada columna: número, fecha o texto.
  function profile(table) {
    return table.headers.map(function (h, k) {
      var vals = table.rows.map(function (r) { return r[k]; });
      var filled = vals.filter(function (v) { return v !== ''; });
      var nums = filled.filter(function (v) { return !isNaN(toNumber(v)); }).length;
      var dates = filled.filter(function (v) { return toDate(v) !== null; }).length;
      var type = 'texto';
      if (filled.length && dates / filled.length >= 0.8) type = 'fecha';
      else if (filled.length && nums / filled.length >= 0.8) type = 'numero';
      return { name: h, index: k, type: type, filled: filled.length, empty: vals.length - filled.length };
    });
  }

  // opts: { factorSalto: 3, limites: { 'columna': maximo } }
  function review(table, opts) {
    opts = opts || {};
    var factor = opts.factorSalto || 3;
    var limites = opts.limites || {};
    var cols = profile(table);
    var findings = [];
    function add(sev, fila, col, tipo, msg) {
      findings.push({ severidad: sev, fila: fila, columna: col, tipo: tipo, mensaje: msg });
    }

    // 1. Celdas vacías
    table.rows.forEach(function (r, i) {
      cols.forEach(function (c) {
        if (r[c.index] === '' && c.filled > 0) add('alta', i + 2, c.name, 'Dato faltante', 'Celda vacía.');
      });
    });

    // 2. Texto donde se espera número o fecha
    table.rows.forEach(function (r, i) {
      cols.forEach(function (c) {
        var v = r[c.index];
        if (v === '') return;
        if (c.type === 'numero' && isNaN(toNumber(v))) add('alta', i + 2, c.name, 'Formato', 'Se esperaba un número y dice "' + v + '".');
        if (c.type === 'fecha' && toDate(v) === null) add('alta', i + 2, c.name, 'Formato', 'Se esperaba una fecha y dice "' + v + '".');
      });
    });

    // 3. Filas duplicadas
    var seen = {};
    table.rows.forEach(function (r, i) {
      var key = r.join('\u0001');
      if (seen[key] !== undefined) add('media', i + 2, '(fila completa)', 'Duplicado', 'Fila idéntica a la fila ' + seen[key] + '.');
      else seen[key] = i + 2;
    });

    // 4. Negativos, saltos y límites en columnas numéricas
    cols.filter(function (c) { return c.type === 'numero'; }).forEach(function (c) {
      var series = table.rows.map(function (r) { return toNumber(r[c.index]); });
      var valid = series.filter(function (v) { return !isNaN(v); });
      var med = median(valid.filter(function (v) { return v > 0; }));
      var lim = limites[c.name];
      series.forEach(function (v, i) {
        if (isNaN(v)) return;
        if (v < 0) add('alta', i + 2, c.name, 'Valor negativo', 'El valor ' + v + ' es negativo.');
        if (!isNaN(med) && med > 0 && valid.length >= 5 && v > med * factor) {
          add('media', i + 2, c.name, 'Salto inusual', 'El valor ' + v + ' es ' + (v / med).toFixed(1).replace('.', ',') + ' veces la mediana de la columna (' + med + ').');
        }
        if (lim !== undefined && lim !== null && !isNaN(lim) && v > lim) {
          add('alta', i + 2, c.name, 'Sobre el límite', 'El valor ' + v + ' supera el límite definido (' + lim + ').');
        }
      });
    });

    // 5. Fechas: desorden, repetidas y saltos en la secuencia
    cols.filter(function (c) { return c.type === 'fecha'; }).forEach(function (c) {
      var ds = table.rows.map(function (r) { return toDate(r[c.index]); });
      var gaps = [];
      for (var i = 1; i < ds.length; i++) {
        if (ds[i] && ds[i - 1]) gaps.push((ds[i] - ds[i - 1]) / 86400000);
      }
      var typical = median(gaps.filter(function (g) { return g > 0; }));
      for (var j = 1; j < ds.length; j++) {
        if (!ds[j] || !ds[j - 1]) continue;
        var g = (ds[j] - ds[j - 1]) / 86400000;
        if (g < 0) add('media', j + 2, c.name, 'Fecha desordenada', 'La fecha es anterior a la de la fila previa.');
        else if (g === 0) add('baja', j + 2, c.name, 'Fecha repetida', 'Misma fecha que la fila previa.');
        else if (!isNaN(typical) && typical > 0 && gaps.length >= 4 && g >= typical * 2) {
          add('media', j + 2, c.name, 'Período faltante', 'Hay ' + g + ' días desde la fila previa; lo habitual en el archivo son ' + typical + '.');
        }
      }
    });

    var order = { alta: 0, media: 1, baja: 2 };
    findings.sort(function (a, b) { return order[a.severidad] - order[b.severidad] || a.fila - b.fila; });
    return {
      filas: table.rows.length,
      columnas: cols,
      hallazgos: findings,
      resumen: {
        alta: findings.filter(function (f) { return f.severidad === 'alta'; }).length,
        media: findings.filter(function (f) { return f.severidad === 'media'; }).length,
        baja: findings.filter(function (f) { return f.severidad === 'baja'; }).length
      }
    };
  }

  // Mismo cruce que hace la SMA: producción = cosecha + mortalidad, contra el límite de la RCA.
  function cruceProduccion(cosecha, mortalidad, limite) {
    var prod = cosecha + mortalidad;
    var exceso = Math.max(0, prod - limite);
    return {
      produccion: Math.round(prod * 100) / 100,
      uso_pct: limite > 0 ? Math.round((prod / limite) * 10000) / 100 : NaN,
      exceso: Math.round(exceso * 100) / 100,
      exceso_pct: limite > 0 ? Math.round((exceso / limite) * 10000) / 100 : NaN,
      supera: prod > limite
    };
  }

  // Próximo vencimiento de una obligación periódica contada desde una fecha base.
  function proximoVencimiento(baseISO, meses, hoy) {
    var b = toDate(baseISO);
    if (!b || !meses) return null;
    var d = new Date(b.getTime());
    var guard = 0;
    while (d <= hoy && guard < 2000) {
      d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + meses, d.getUTCDate()));
      guard++;
    }
    return d;
  }

  function semaforo(dias, aviso) {
    if (dias < 0) return 'vencido';
    if (dias <= aviso) return 'alerta';
    return 'ok';
  }

  var api = { parseCSV: parseCSV, toNumber: toNumber, toDate: toDate, profile: profile, review: review, cruceProduccion: cruceProduccion, proximoVencimiento: proximoVencimiento, semaforo: semaforo, median: median };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Revisor = api;
})(typeof window !== 'undefined' ? window : this);

</script>

}

  return `<div class="ruta">Etapa 1: sistema interno de gestión</div><div class="ph"><h1>Fechas críticas</h1><p>Nueve semanas hacia adelante. Cada punto es un vencimiento calculado con la regla de su norma; la franja que lo antecede son los 5 días de aviso. La idea es que, en el sistema definitivo, ese aviso llegue por correo a quien decide.</p></div>

    ${fs.map((f) => { const e = estF(f); return `<div class="rg-row"><div><div style="font-weight:600;color:var(--ink)">${esc(f.t)}</div><div style="font-size:13px;color:var(--txt2)">${esc(f.aut)}. ${fLarga(f.d)}. ${REGN[f.regla]}: ${respaldo(f.o)}.</div></div>

VISTAS.criticidad = function () {

  const mar = ext.filter((o) => o.mar).reduce((a, o) => a + o.per, 0), mx = Math.max(1, ...it.map((o) => o.per || 0));
  const Q = { '3-1': 'Cumplir con el mínimo esfuerzo', '3-2': 'Asegurar el cumplimiento', '3-3': 'Automatizar primero', '2-1': 'Simplificar', '2-2': 'Ordenar', '2-3': 'Formalizar con procedimiento', '1-1': 'Simplificar o dejar', '1-2': 'Mantener', '1-3': 'Formalizar con procedimiento' };
  const fila = (c) => `<div class="ax"><b>Criticidad ${CRITN[c].toLowerCase()}</b><span>${nC(c)} obligaciones</span></div>${[1, 2, 3].map((v) => `<div class="${c === 3 && v === 3 ? 'hot' : ''}">${Q[c + '-' + v]}</div>`).join('')}`;
  return `<div class="ruta">Etapa 1: sistema interno de gestión</div><div class="ph"><h1>Criticidad y carga de entregas</h1><p>El análisis de criticidad y valor, hasta donde se puede llegar con información pública. La criticidad y la cantidad de entregas salen de la norma. El valor para la gestión y las horas que toma cada entrega se definen con cada área en la etapa 1: aquí no se suponen.</p></div>
  <div class="tira">
    <div><b>${nC(3)}</b><span>de criticidad alta: ante una autoridad que fiscaliza y sanciona</span></div>
    <div><b>${nC(2)}</b><span>de criticidad media: compromisos con la comunidad incluidos en el permiso</span></div>
    <div><b>${nC(1)}</b><span>de criticidad baja: registros internos que respaldan a las demás</span></div>
    <div><b>${n0(tE)}</b><span>entregas periódicas al año a autoridades y comunidad, con un centro de mar. Cada centro adicional suma ${mar}</span></div>
  </div>
  <div class="panel pri"><header><div><h2>Cómo se ordena</h2><p>Cada obligación se ubica según su criticidad y su valor para la gestión. La casilla indica qué conviene hacer con ella.</p></div></header><div class="body">
    <div class="pm3"><div class="axx"></div><div class="axx">Valor bajo</div><div class="axx">Valor medio</div><div class="axx">Valor alto</div>${fila(3)}${fila(2)}${fila(1)}</div>
    <p class="nota">Hoy se conoce solo el eje de criticidad, que sale de una regla fija según a quién se le responde. El eje de valor se completa en una sesión de trabajo con cada área, y con eso cada obligación queda en una casilla.</p></div></div>
  <div class="panel"><header><div><h2>Obligaciones por criticidad y entregas al año</h2><p>La frecuencia es la que fija cada norma. Las entregas son por año y, en las marcadas «por centro», por cada centro de mar.</p></div></header><div class="body">
    <div class="bar2 h"><span>Obligación</span><span></span><span style="text-align:right">Entregas al año</span><span>Criticidad</span></div>
    ${it.map((o) => `<div class="bar2"><span><b style="font-weight:600;color:var(--ink)">${nom(o)}</b><br><span style="font-size:13px;color:var(--txt2)">${esc(o.aut)}, ${esc(o.fr.toLowerCase())}${o.mar ? ', por centro' : ''}. ${respaldo(o)}</span></span>
      <div class="tr">${o.per != null ? `<i style="width:${o.per / mx * 100}%"></i>` : ''}</div><span class="n">${o.per != null ? n0(o.per) : '<span style="font-family:var(--sans);font-size:13px;font-weight:400;color:var(--txt3)">según la operación</span>'}</span><span>${badgeCrit(o.crit)}</span></div>`).join('')}
    <p class="nota">Los registros internos, como el control diario del ensilaje, no se cuentan como entregas a terceros. Las obligaciones «por evento» dependen de la operación y no tienen una cantidad anual fija.</p></div></div>`;
};

VISTAS.comunidad.despues = function () {
  const Sx = D.red.sectores, W = 1000, H = 760, cx = W / 2, cy = H / 2, R1 = 122, R2 = 232, RL = 300, GAP = 2.2, MINS = 6;

    g.addEventListener('mousemove', (ev) => { const b = w.getBoundingClientRect(); tip.innerHTML = `<b>${g.dataset.o}</b>${g.dataset.t}, ${g.dataset.sec}<br>${g.dataset.m} en ${g.dataset.k} ${g.dataset.k === '1' ? 'registro' : 'registros'}`; let x = ev.clientX - b.left + 14; if (x > b.width - 270) x = ev.clientX - b.left - 274; tip.style.left = x + 'px'; tip.style.top = (ev.clientY - b.top + 14) + 'px'; tip.style.opacity = 1; });

};

// ================= REFERENTES =================

    ${D.refs.map((r) => `<div class="ref"><div><h3>${esc(r.q)}</h3><span>${esc(r.l)}</span></div><div>${esc(r.que)}<div class="ln">${r.src.map((x) => enl(x[0], x[1])).join('<br>')}</div></div><div><div class="tm">${esc(r.toma)}</div></div></div>`).join('')}

  ['En general', [['x1', '¿Qué es lo más débil hoy en la gestión de la información?'], ['x2', '¿Cómo les gustaría que funcionara: avisos, un tablero semanal, un resumen automático, otra forma?'], ['x3', '¿Qué tendría que ocurrir para considerar que el trabajo valió la pena?']]]
];
const nResp = () => PREG.reduce((a, g) => a + g[1].filter(([k]) => String(S.resp[k] || '').trim()).length, 0);
const nPreg = PREG.reduce((a, g) => a + g[1].length, 0);
const txtResp = () => (nResp() ? nResp() + ' de ' + nPreg + ' respondidas. ' : '') + 'Las respuestas se guardan solas en este navegador.';
VISTAS.preguntas = function () {
  return `<div class="ph"><h1>Preguntas</h1><p>El sistema se construye a la medida de INVERMAR, y para eso ayuda entender cómo se trabaja hoy. Se puede responder lo que se estime, con palabras propias. No hace falta contestar todas: las que queden se pueden conversar en una reunión.</p></div>
  ${PREG.map(([g, qs]) => `<div class="panel"><header><div><h2>${g}</h2></div></header><div class="body">${qs.map(([k, q]) => `<div class="q"><label for="q-${k}">${q}</label><textarea id="q-${k}" oninput="A.resp('${k}',this.value)">${esc(S.resp[k] || '')}</textarea></div>`).join('')}</div></div>`).join('')}
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="btn" onclick="A.ir('opinion')">Ir a enviar las respuestas</button><span class="nota" style="margin:0" id="preg-n">${txtResp()}</span></div>`;
};
A.resp = (k, v) => { S.resp[k] = v; guardar(); const e = $('preg-n'); if (e) e.textContent = txtResp(); };

// ================= SU OPINIÓN =================
const FBP = ['Sirve y es prioritario', 'Sirve', 'No sirve por ahora'];
function avance() {
  return { lin: S.ped.filter((p) => p.fb).length, pre: nResp(), pan: Object.keys(NOMV).filter((k) => S.fb[k] && (S.fb[k].v || S.fb[k].nota)).length };
}
VISTAS.opinion = function () {
  const av = avance(), fbs = Object.keys(NOMV).filter((k) => S.fb[k] && (S.fb[k].v || S.fb[k].nota));
  return `<div class="ph"><h1>Su opinión</h1><p>Lo que más ayuda en este momento es saber qué sirve y qué no. Con eso se ajusta la propuesta y se define por dónde partir. Basta con marcar las líneas de trabajo; todo lo demás es opcional.</p></div>
  <div class="panel pri"><header><div><h2>Cómo se envía</h2><p>Nada se envía solo: lo que se escribe queda en este navegador hasta que se comparte.</p></div></header><div class="body">
    <div class="tira" style="margin-bottom:16px">
      <div><b class="${av.lin ? 'ok' : ''}">${av.lin} de ${S.ped.length}</b><span>líneas de trabajo con opinión</span></div>
      <div><b class="${av.pan ? 'ok' : ''}">${av.pan} de ${Object.keys(NOMV).length}</b><span>pantallas comentadas</span></div>
      <div><b class="${av.pre ? 'ok' : ''}">${av.pre} de ${nPreg}</b><span>preguntas respondidas</span></div>
    </div>
    <div class="envio"><button class="btn" onclick="A.bajar()">Descargar archivo de respuestas</button><button class="btn sec" onclick="A.copiar()">Copiar resumen para un mensaje</button><span class="nota" id="env-msg" role="status" style="margin:0"></span></div>
    <p class="kv" style="margin-top:14px;max-width:88ch">El archivo se llama <b>respuestas_invermar_${iso(HOY)}.txt</b> y queda en la carpeta de descargas. Se puede enviar por correo o WhatsApp, como cualquier documento. «Copiar resumen» deja el mismo texto listo para pegarlo en un mensaje.</p>
    <p class="kv" style="margin-top:8px;max-width:88ch">Las respuestas quedan guardadas en este navegador, por lo que se puede avanzar de a poco y volver después a esta misma dirección.</p>
  </div></div>
  <div class="panel"><header><div><h2>Líneas de trabajo</h2><p>Lo que la consultora puede hacer, ordenado por etapa. ${av.lin} de ${S.ped.length} con opinión.</p></div></header><div class="body flush"><div class="tw"><table class="t"><thead><tr><th>Etapa</th><th>Qué</th><th>Qué gana el equipo</th><th>Qué hay en esta maqueta</th><th>¿Sirve?</th><th>Comentario</th><th></th></tr></thead><tbody>
    ${S.ped.map((p) => `<tr><td style="white-space:nowrap"><span class="b ${p.own ? '' : 'ink'}">${p.own ? 'Agregada' : ETN[p.et] || ''}</span></td><td class="nm" style="min-width:200px">${esc(p.t)}</td><td>${esc(p.c || '')}</td><td><span class="b ${p.own ? 'inf' : esc(p.col || '')}" style="white-space:normal">${esc((p.e || '').replace('{N}', OB.length))}</span></td>
      <td><select style="width:178px" onchange="A.pfb('${esc(p.id)}',this.value)">${[''].concat(FBP).map((o) => `<option value="${o}" ${(p.fb || '') === o ? 'selected' : ''}>${o || 'Elegir'}</option>`).join('')}</select></td>
      <td><input type="text" style="min-width:170px" value="${esc(p.nota || '')}" placeholder="Opcional" onchange="A.pnota('${esc(p.id)}',this.value)"></td><td>${p.own ? `<button class="btn lnk" onclick="A.pdel('${esc(p.id)}')">Quitar</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div></div></div>
  <div class="panel"><header><div><h2>¿Falta algo?</h2><p>Una necesidad que no esté en la lista. Se evalúa y se responde cómo se abordaría.</p></div></header><div class="body">
    <form class="f" onsubmit="return A.padd(event)"><label class="w2">Qué se necesita<input type="text" name="t" required placeholder="Ej: que el reporte semanal se arme solo"></label><label class="w2">Para qué<input type="text" name="c" placeholder="Ej: hoy toma un día completo"></label><button class="btn" type="submit">Agregar</button></form></div></div>
  <div class="panel"><header><div><h2>Lo marcado en cada pantalla</h2><p>Sale de la barra «¿Sirve esta pantalla?» que está al pie de cada una.</p></div></header><div class="body">
    ${fbs.length ? fbs.map((k) => `<div class="fila"><div class="gr"><div class="ti">${NOMV[k]}</div>${S.fb[k].nota ? `<div class="su2">${esc(PQ[k])}</div><div class="su2" style="color:var(--txt)">${esc(S.fb[k].nota)}</div>` : ''}</div>${FBV.indexOf(S.fb[k].v) > -1 ? `<span class="b ${S.fb[k].v === 'No sirve' ? '' : 'ok'}">${S.fb[k].v}</span>` : ''}</div>`).join('') : '<p class="vacio">Todavía no se ha marcado ninguna pantalla.</p>'}</div></div>
  <details class="mas"><summary><span>Abrir un archivo de respuestas<small>Para seguir en otro computador o revisar lo que respondió otra persona</small></span></summary><div style="padding:16px 20px">
    <input type="file" id="rec-file" accept=".txt,text/plain"> <span class="nota" id="rec-msg" role="status" style="margin:0"></span>
    <p class="nota">Tiene que ser el archivo que se descarga desde esta pantalla, sin modificar. Al abrirlo, lo que hay en este navegador se guarda aparte y se puede volver a la copia propia en cualquier momento.</p></div></details>
  <p class="nota">Todo queda guardado solo en este navegador. <button class="btn lnk" onclick="A.reiniciar()">Borrar todo lo escrito</button></p>`;
};
VISTAS.opinion.despues = function () {
  const f = $('rec-file');
  if (f) f.addEventListener('change', (ev) => { const a = ev.target.files[0]; if (!a) return; const r = new FileReader(); r.onload = () => A.abrirRec(a.name, String(r.result || '')); r.readAsText(a, 'utf-8'); });
};
A.pfb = (id, v) => { S.ped.find((p) => p.id === id).fb = v; guardar(); pintar(); };
A.pnota = (id, v) => { S.ped.find((p) => p.id === id).nota = v; guardar(); };
A.pdel = (id) => { S.ped = S.ped.filter((p) => p.id !== id); guardar(); pintar(); };
A.padd = (ev) => { ev.preventDefault(); const o = Object.fromEntries(new FormData(ev.target).entries()); S.ped.push({ id: 'p' + Date.now(), et: '', t: o.t, c: o.c, e: 'Agregada por quien revisa', col: 'inf', own: true }); guardar(); pintar(); return false; };

// Texto legible con todo lo marcado y escrito.
function textoRespuestas() {
  const av = avance(), L = ['Propuesta de sistema de gestión para INVERMAR', 'Respuestas y opinión', 'Fecha: ' + HOY.toLocaleDateString('es-CL'), ''];
  L.push('RESUMEN', '- Líneas de trabajo con opinión: ' + av.lin + ' de ' + S.ped.length, '- Pantallas comentadas: ' + av.pan + ' de ' + Object.keys(NOMV).length, '- Preguntas respondidas: ' + av.pre + ' de ' + nPreg, '- Partiría por: ' + (S.piloto && PIL[S.piloto] ? PIL[S.piloto].t : '(sin elegir)'));
  L.push('', 'LÍNEAS DE TRABAJO'); S.ped.forEach((p) => { L.push('- [' + (p.own ? 'Agregada' : ETN[p.et] || '') + '] ' + p.t + ': ' + (p.fb || 'sin marcar') + (p.nota ? ' | ' + p.nota : '') + (p.own && p.c ? ' | Para qué: ' + p.c : '')); });
  L.push('', 'PANTALLAS'); let np = 0;
  Object.keys(NOMV).forEach((k) => { const f = S.fb[k]; if (f && (f.v || f.nota)) { np++; L.push('- ' + NOMV[k] + ': ' + (f.v || 'sin marcar')); if (f.nota) L.push('  ' + PQ[k], '  ' + f.nota); } });
  if (!np) L.push('(ninguna marcada)');
  L.push('', 'PREGUNTAS'); PREG.forEach(([g, qs]) => { L.push(g); qs.forEach(([k, q]) => { L.push('- ' + q, '  ' + (String(S.resp[k] || '').trim() || '(sin responder)')); }); });
  return L;
}
const b64e = (s) => btoa(unescape(encodeURIComponent(s)));
const b64d = (s) => decodeURIComponent(escape(atob(s)));
const aviso = (id, t) => { const e = $(id); if (e) e.textContent = t; };
A.bajar = () => {
  const L = textoRespuestas(), datos = Object.assign({}, S); delete datos.recibido;
  L.push('', '', '--- Datos para abrir este archivo en la propuesta. No modificar desde aquí. ---', 'INV4:' + b64e(JSON.stringify({ v: 4, f: iso(HOY), s: datos })));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([String.fromCharCode(65279) + L.join('\r\n')], { type: 'text/plain;charset=utf-8' }));
  a.download = 'respuestas_invermar_' + iso(HOY) + '.txt'; document.body.appendChild(a); a.click(); a.remove();
  aviso('env-msg', 'Archivo descargado. Queda en la carpeta de descargas.');
};
A.copiar = () => {
  const t = textoRespuestas().join('\n'), listo = () => aviso('env-msg', 'Resumen copiado. Se puede pegar en un correo o en WhatsApp.');
  const plan = () => { const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select(); let r = false; try { r = document.execCommand('copy'); } catch (e) { r = false; } ta.remove(); if (r) listo(); else aviso('env-msg', 'No se pudo copiar desde este navegador. Queda la opción de descargar el archivo.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(listo, plan); else plan();
};

// Un archivo de respuestas viene de fuera: se acepta solo lo que tiene la forma esperada.
function sanear(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.ped)) return null;
  const n = nuevo(), tx = (v, m) => String(v == null ? '' : v).slice(0, m), ob = (x) => (x && typeof x === 'object' && !Array.isArray(x) ? x : {});
  Object.keys(NOMV).forEach((k) => { const e = ob(ob(d.fb)[k]), o = {}; if (FBV.indexOf(e.v) > -1) o.v = e.v; if (e.nota) o.nota = tx(e.nota, 800); if (Object.keys(o).length) n.fb[k] = o; });
  PREG.forEach((g) => g[1].forEach(([k]) => { const v = ob(d.resp)[k]; if (v) n.resp[k] = tx(v, 4000); }));
  d.ped.slice(0, 80).forEach((p, i) => {
    p = ob(p); const base = !p.own && n.ped.find((x) => x.id === p.id);
    const o = base || { id: 'pr' + i, et: '', t: tx(p.t, 200), c: tx(p.c, 300), e: 'Agregada por quien revisa', col: 'inf', own: true };
    if (!base && !o.t) return;
    if (FBP.indexOf(p.fb) > -1) o.fb = p.fb; if (p.nota) o.nota = tx(p.nota, 800);
    if (!base) n.ped.push(o);
  });
  n.piloto = Object.prototype.hasOwnProperty.call(PIL, d.piloto) ? d.piloto : ''; n.intro = false;
  return n;
}
A.abrirRec = (nombre, texto) => {
  const m = /INV4:([A-Za-z0-9+\/=]+)/.exec(texto || ''); let d = null;
  try { d = m ? JSON.parse(b64d(m[1])) : null; } catch (e) { d = null; }
  const s = d && sanear(d.s);
  if (!s) { aviso('rec-msg', 'No se pudo leer ese archivo. Tiene que ser el que se descarga desde esta pantalla, sin modificar.'); return; }
  try { if (!S.recibido) localStorage.setItem(KEY + '_respaldo', JSON.stringify(S)); } catch (e) {}
  s.recibido = { archivo: String(nombre || 'archivo').slice(0, 80), fecha: /^\d{4}-\d{2}-\d{2}$/.test(String(d.f || '')) ? fechaCL(d.f) : '' };
  S = s; guardar(); ir('opinion');
};
A.salirRec = () => {
  let r = null; try { r = JSON.parse(localStorage.getItem(KEY + '_respaldo') || 'null'); } catch (e) { r = null; }
  S = r && Array.isArray(r.ped) ? r : nuevo(); delete S.recibido; guardar();
  try { localStorage.removeItem(KEY + '_respaldo'); } catch (e) {}
  pintar();
};

pintar();


})();
